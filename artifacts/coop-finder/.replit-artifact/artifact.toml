kind = "web"
previewPath = "/"
title = "Tessa Hood – The Coop Finder"
version = "1.0.0"
id = "artifacts/coop-finder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18651

[services.development]
run = "pnpm --filter @workspace/coop-finder run dev"

[services.production]
publicDir = "artifacts/coop-finder/site"
